# Reference example: log.opentelemetry, log.network and log.metrics_rules --
# OpenTelemetry-native log shipping and log-to-metric counting, in one
# unified configuration. This is meant to be read, not run as-is: some
# sections show mutually exclusive alternatives rather than a single valid
# config.

log:
  # =========================================================================
  # log.opentelemetry -- log shipping and log-to-metric counting, unified.
  # A receiver is a single named source: it can ship its logs, count metrics
  # out of them, both, or neither is meaningful (a receiver must always have
  # at least one source selector: include, container_name,
  # container_selectors, or network).
  # =========================================================================
  opentelemetry:
    # shipping_enable is the master switch for log SHIPPING. false disables
    # shipping entirely, regardless of any other setting below. Default true.
    shipping_enable: true

    # send_logs is the global default for whether a RECEIVER ships its logs,
    # applied unless the receiver overrides it with its own send_logs: field.
    # Default true. With zero configured receivers, nothing ships regardless
    # of this default -- there's nothing to apply it to.
    #
    # This default only applies to receivers (sources you explicitly
    # configured). A container reached ONLY through the glouton.* label
    # fallback (no receiver entry at all) was never explicitly configured, so
    # it does NOT use this default when it carries no shipping-related label
    # either -- see auto_discovery.container_and_service_enable below and the
    # container-labels section at the end of this file.
    send_logs: true

    # auto_discovery automatically watches well-known shipping sources,
    # without needing a receiver entry for each. Shipping only -- it never
    # opts anything into metrics counting. container_and_service_enable also
    # doubles as the SHIPPING default for a container reached only through
    # the glouton.* label fallback and carrying neither glouton.send_logs nor
    # glouton.log_enable itself: true ships it like any other auto-discovered
    # container, false leaves it unshipped unless explicitly labeled (see the
    # container-labels section at the end of this file). It never affects
    # glouton.log_metrics either way -- metrics stays fully independent.
    auto_discovery:
      all_enable: false
      journald_enable: true
      syslog_enable: false
      auditd_enable: false
      container_and_service_enable: true

    # known_log_formats: named groups of stanza operators that parse a raw
    # log line into structured attributes, referenced by name from a
    # receiver's log_format: field, or from a container's glouton.log_format
    # label. A few common formats ("apache_access", "nginx_access", ...)
    # already exist as built-in defaults; entries here are merged with them.
    known_log_formats:
      my_custom_format:
        - type: regex_parser
          regex: '^(?P<level>\w+): (?P<message>.*)$'

    # container_format: map of container name -> known_log_formats entry,
    # applied to a container's shipped/counted logs when it has no receiver
    # entry and no glouton.log_format label of its own.
    container_format:
      my-nginx-container: nginx_access

    # known_log_filters: named groups of OTELFilters (drop/keep, not
    # counting), referenced by name from a receiver's filters: field or a
    # container's glouton.log_filter label.
    known_log_filters:
      min_level_info:
        include:
          severity_number:
            min: "9"

    # container_filter: map of container name -> known_log_filters entry,
    # same fallback role as container_format, for shipping filters.
    container_filter:
      my-nginx-container: min_level_info

    # global_filters: OTELFilters applied to every shipped record, on top of
    # any receiver- or container-specific filter.
    global_filters:
      log_record:
        - 'HasPrefix(resource.attributes["service.name"], "private_")'

    # container_exclude vetoes a matching container from EVERYTHING below --
    # shipping auto_discovery, an explicit receiver's container_name/
    # container_selectors, and the glouton.* label fallback alike. Checked
    # first, before any other selection mechanism, so nothing below can
    # override it.
    container_exclude:
      - container_name: some-noisy-container
      - selectors:
          env: staging

    # receivers: every named log source, for shipping and/or metrics.
    receivers:
      # --- source selectors ---
      # A receiver needs at least one of: include (file paths/globs),
      # container_name (exact container name match), container_selectors
      # (label/annotation match), or network (see the network: field further
      # down). Several can be combined on the same receiver -- every match
      # from any of them feeds this receiver's metrics and/or shipping as a
      # single unit, under this receiver's name. container_name and
      # container_selectors can be combined too, AND'ed together (a container
      # must match both to be watched by that receiver).
      #
      # If a container matches TWO DIFFERENT receivers at once, that's not a
      # conflict: both independently watch it and each produces its own
      # metrics/shipping under its own item -- no precedence between
      # receivers, only between a receiver and the glouton.* label fallback
      # (see below).
      app:
        include:
          - /var/log/myapp/*.log
        # Any real filelogreceiver/fileconsumer field pastes in verbatim
        # alongside include, since a file-based receiver decodes straight
        # into the real vendored config:
        start_at: beginning
        encoding: utf-16le
        exclude:
          - /var/log/myapp/*.debug.log

        # log_format references a known_log_formats entry, parsing each line
        # into attributes before shipping and before any metric's conditions
        # run against it.
        log_format: apache_access

        # operators: raw inline parsing stanzas (OTel-native), an alternative
        # to log_format for one-off receivers.
        operators:
          - type: add
            field: resource["service.name"]
            value: "myapp"

        # filters: OTELFilters for SHIPPING (drop/keep, not counting).
        filters:
          log_record:
            - 'IsMatch(body, ".*debug.*")'

        # send_logs overrides the global default for this receiver only.
        send_logs: true

        # metrics: log-to-metric definitions fed by this receiver. A list,
        # freely mixing two kinds of entries in any combination:
        #   - {include: <name>} pulls in every metric defined under that
        #     log.metrics_rules entry (see further down).
        #   - an inline {metric:, ...} definition, self-contained.
        # A receiver can also have no metrics: at all (shipping only).
        metrics:
          - include: known_web_errors        # a metrics_rules entry, reused

          - metric: app_errors_count          # inline, defined only here
            conditions:
              - 'IsMatch(body, "\\[error\\]") and not IsMatch(body, "known_noisy_error")'

            # attributes: OpenTelemetry countconnector's own dynamic
            # group-by-value mechanism. Each entry names an attribute key
            # (usually produced by log_format/operators above); at runtime,
            # one series is created per DISTINCT VALUE actually seen for
            # that key. Real cardinality risk -- the number of series
            # depends on what the logs actually contain.
            attributes:
              - key: payment.decline_reason
              - key: payment.method

            # labels: a fixed map[string]string, stamped identically on
            # every sample of this metric. Zero cardinality risk, since the
            # values never depend on log content -- purely static tags.
            labels:
              env: prod
              team: backend

            # item identifies which configured source this metric's series
            # came from, so the customer isn't confused seeing the same
            # metric name from two different places. Always set:
            #   - for a receiver like this one, item defaults to the
            #     receiver's own name ("app"), even if its selectors end up
            #     matching several containers at once -- merging several
            #     containers under one item is then an explicit choice, made
            #     by using a broad selector under one named receiver.
            #   - for a container that opted in purely via the
            #     glouton.log_metrics label (no receiver entry exists for
            #     it), item is that container's own runtime name instead,
            #     keeping different containers sharing the same label value
            #     from merging into one series.
            # A metric can override this explicitly:
          - metric: with_custom_item
            regex: '\[warn\]'
            item: "app-warnings"

          # Matching against a PARSED ATTRIBUTE instead of the raw body --
          # requires log_format/operators above to have produced it first.
          - metric: apache_server_error
            conditions:
              - 'IsMatch(attributes["http.response.status_code"], "5..")'

          # regex: is sugar for a single condition matching the raw body,
          # equivalent to conditions: ['IsMatch(body, "...")'].
          - metric: app_broken_rate
            regex: '(unterminated group'

          # Multiple conditions are OR'ed together -- this matches a 4xx OR
          # a 5xx status, not only requests that are both.
          - metric: client_or_server_error_rate
            conditions:
              - 'IsMatch(attributes["http.response.status_code"], "4..")'
              - 'IsMatch(attributes["http.response.status_code"], "5..")'

      # A receiver can watch containers instead of (or alongside) files.
      web-workers:
        container_selectors:
          app: web-worker
        send_logs: true
        metrics:
          - include: known_web_errors

      # container_name matches by exact container name instead of (or
      # combined with) labels/annotations.
      redis:
        container_name: redis
        metrics:
          - metric: redis_errors_count
            regex: ERROR

      # Mixing several selector kinds (and several of the same kind) on one
      # receiver merges everything they match into this single receiver,
      # sharing item="mixed-example":
      mixed-example:
        include:
          - /var/log/some-app/*.log
        container_selectors:
          component: some-app
        metrics:
          - metric: some_app_errors
            regex: '\[error\]'

      # --- network participation ---
      # A receiver accepts pushed logs (e.g. gRPC/HTTP OTLP) via a nested
      # network: field, in one of two forms:
      billing_from_grpc:
        # Form A (advanced): reference one or more log.network.receivers
        # entries by name -- can share a listener with other receivers.
        network:
          receivers: [otlp]
        send_logs: true
        metrics:
          - metric: billing_error_rate
            conditions:
              - 'resource["service.name"] == "billing"'

      internal_from_grpc:
        # Form B (shortcut): auto-provisions a default shared listener
        # (grpc+http, standard ports) the first time any receiver uses it.
        network:
          enable: true
        send_logs: false
        metrics:
          - metric: internal_error_rate
            regex: '\[error\]'

  # =========================================================================
  # log.metrics_rules -- reusable metric definitions, referenced by name from
  # any receiver's metrics: list via {include: <name>}. A metrics_rules entry
  # does nothing on its own until included somewhere. Each entry is a list,
  # same shape as an inline metrics: definition (metric/conditions/regex/
  # attributes/labels), so it can define more than one metric at once.
  # =========================================================================
  metrics_rules:
    known_web_errors:
      - metric: web_error_rate
        conditions:
          - 'IsMatch(body, "\\[error\\]")'
      - metric: web_success_rate
        conditions:
          - 'IsMatch(body, "\\[success\\]")'

  # =========================================================================
  # log.network -- named, reusable OTel-native listener(s), shared by any
  # number of log.opentelemetry.receivers via their own network: field.
  # =========================================================================
  network:
    receivers:
      # A receiver with both protocols enabled (protocol enabled = key
      # present); endpoint is optional, falling back to the OTel receiver's
      # own factory default for that protocol when omitted.
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4418"

      # A second, independent listener -- gRPC only, on a different port.
      # Nothing uses this one unless a receiver's network.receivers list
      # names it explicitly.
      otlp/internal:
        protocols:
          grpc:
            endpoint: "127.0.0.1:4419"

  # =========================================================================
  # log.inputs -- the legacy Fluent Bit-era way of declaring log-to-metric.
  # Still accepted and automatically translated into the log.opentelemetry
  # shape above; prefer log.opentelemetry.receivers/metrics for new config.
  # =========================================================================
  inputs:
    - path: /var/log/legacy-app/*.log
      filters:
        - metric: legacy_errors_count
          regex: '\[error\]'
          labels:
            env: prod

    - container_name: legacy-container
      filters:
        - metric: legacy_container_errors
          regex: ERROR

    - container_selectors:
        app: legacy-app
      filters:
        - metric: legacy_selector_errors
          regex: ERROR

# =============================================================================
# Container labels/annotations -- set on a Docker container or Kubernetes
# pod/annotation directly, for containers that have no matching entry under
# log.opentelemetry.receivers (e.g. a fleet whose container names aren't
# known ahead of time):
#
#   glouton.log_enable=<bool>     Skip this container's logs entirely
#                                 (shipping and metrics both) when false.
#
#   glouton.log_format=<name>     A known_log_formats entry, applied to BOTH
#                                 this container's shipped logs and its
#                                 metrics conditions/attributes.
#
#   glouton.log_filter=<name>     A known_log_filters entry, applied to this
#                                 container's shipped logs.
#
#   glouton.send_logs=<bool>      Ship this container's logs or not.
#
#   glouton.log_metrics=<name>    A log.metrics_rules entry to count this
#                                 container's logs against. item = this
#                                 container's own runtime name.
#
# A container already matched by an explicit receiver's container_name/
# container_selectors ignores EVERY glouton.* label above -- that receiver's
# own send_logs/log_format become authoritative for it, and glouton.log_metrics
# is ignored too, so it's counted exactly once, under that receiver's own
# item, not twice.
#
# Shipping decision for a label-only container (matched by no receiver), in
# priority order:
#   1. glouton.send_logs, if set -- wins outright.
#   2. glouton.log_enable=true, if send_logs isn't set -- implies shipping
#      (back-compat with configs that only ever set log_enable).
#   3. Otherwise, auto_discovery.container_and_service_enable -- NOT
#      log.opentelemetry.send_logs, which only defaults receivers. A
#      container with no glouton.* label at all only ships if blanket
#      auto-discovery is on.
# glouton.log_metrics is unaffected by any of this -- it's read unconditionally,
# independent of auto_discovery and of the shipping decision above.
# =============================================================================
