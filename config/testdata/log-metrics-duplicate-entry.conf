log:
  opentelemetry:
    receivers:
      app:
        include:
          - /var/log/app.log
        metrics:
          - metric: log_common_code
            conditions:
              - 'IsMatch(attributes["http.response.status_code"], "2..")'
            labels:
              code: "2xx"
          - metric: log_common_code
            conditions:
              - 'IsMatch(attributes["http.response.status_code"], "2..")'
            labels:
              code: "2xx"
