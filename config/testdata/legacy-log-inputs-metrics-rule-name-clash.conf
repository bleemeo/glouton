log:
  metrics_rules:
    legacy_log_inputs_metric_apache_errors_count:
      - metric: apache_errors_count
        item: ""
        conditions:
          - 'IsMatch(body, "totally unrelated pattern")'
  inputs:
    - path: /var/log/apache/access.log
      filters:
        - metric: apache_errors_count
          regex: \[error\]
